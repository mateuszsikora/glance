name: Android

on:
  pull_request:
  push:
    branches: [master]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Test, lint and build
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug assembleRelease

  # Publishes a release for an explicitly pushed v* tag. The artifact is unsigned, always: this
  # project does not hold a signing key on anyone's behalf, and an operator signs the build with
  # their own key before it reaches a tablet. See docs/self-hosted-updates.md.
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # versionCode is derived from the commit count, so the full history is required.
          fetch-depth: 0
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Build unsigned release
        id: build
        run: |
          set -euo pipefail
          VERSION_NAME="${GITHUB_REF_NAME#v}"
          # Commit count rather than the tag: Android compares versionCode numerically and refuses
          # an update that does not increase it, and tag names are not reliably ordered that way.
          VERSION_CODE="$(git rev-list --count HEAD)"
          ./gradlew assembleRelease \
            "-PversionCode=${VERSION_CODE}" \
            "-PversionName=${VERSION_NAME}"
          echo "version_code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"
          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"

      - name: Align and describe the artifact
        run: |
          set -euo pipefail
          # zipalign runs here, where the x86_64 Android build tools exist. Google ships no
          # arm64 Linux build tools, so a Raspberry Pi updater can only sign, never align.
          BUILD_TOOLS="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          "$BUILD_TOOLS/zipalign" -p -f 4 \
            app/build/outputs/apk/release/app-release-unsigned.apk \
            glance-unsigned.apk

          # Computed before the heredoc: a command substitution that fails inside one would not
          # trip `set -e`, and the manifest would silently carry an empty digest.
          SHA256="$(sha256sum glance-unsigned.apk | cut -d' ' -f1)"
          cat > build.json <<EOF
          {
            "versionCode": ${{ steps.build.outputs.version_code }},
            "versionName": "${{ steps.build.outputs.version_name }}",
            "commit": "${GITHUB_SHA}",
            "asset": "glance-unsigned.apk",
            "sha256": "${SHA256}"
          }
          EOF
          cat build.json

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" glance-unsigned.apk build.json \
            --verify-tag \
            --title "Glance ${{ steps.build.outputs.version_name }}" \
            --notes "$(cat <<'NOTES'
          `glance-unsigned.apk` is an **unsigned** build artifact. Android cannot install it as it
          stands, and that is deliberate: this project never publishes a signed APK, because doing
          so would tie every installation to a key held by the maintainer. Device Owner
          installations can only be updated by an APK carrying the same certificate as the one they
          were provisioned with, so that key has to be yours.

          Sign this artifact with your own key and serve it to your tablets. `tools/updater`
          automates both steps; the procedure is in `docs/self-hosted-updates.md`.

          `build.json` describes the artifact for automated updaters.
          NOTES
          )"
