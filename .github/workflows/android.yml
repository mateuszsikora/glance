name: Android

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
      - name: Test, lint and build
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug assembleRelease

  # Publishes an unsigned build artifact for self-hosted updaters. Signing deliberately happens on
  # the operator's own machine: no signing key is available to, or needed by, this workflow. An
  # unsigned APK cannot be installed by Android, so it is a half-product rather than a release.
  publish:
    if: github.ref == 'refs/heads/master'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # versionCode is derived from the commit count, so the full history is required.
          fetch-depth: 0
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Build unsigned release
        id: build
        run: |
          set -euo pipefail
          VERSION_CODE="$(git rev-list --count HEAD)"
          ./gradlew assembleRelease "-PversionCode=${VERSION_CODE}"
          echo "version_code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"

      - name: Align and describe the artifact
        id: artifact
        run: |
          set -euo pipefail
          # zipalign runs here, where the x86_64 Android build tools exist. Google ships no
          # arm64 Linux build tools, so a Raspberry Pi updater can only sign, never align.
          BUILD_TOOLS="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          "$BUILD_TOOLS/zipalign" -p -f 4 \
            app/build/outputs/apk/release/app-release-unsigned.apk \
            glance-unsigned.apk

          VERSION_CODE="${{ steps.build.outputs.version_code }}"
          SHA256="$(sha256sum glance-unsigned.apk | cut -d' ' -f1)"
          BASE_NAME="$(sed -n 's/^val baseVersionName = "\(.*\)"$/\1/p' app/build.gradle.kts)"
          cat > build.json <<EOF
          {
            "versionCode": ${VERSION_CODE},
            "versionName": "${BASE_NAME}-${VERSION_CODE}",
            "commit": "${GITHUB_SHA}",
            "asset": "glance-unsigned.apk",
            "sha256": "${SHA256}"
          }
          EOF
          cat build.json

      - name: Publish to the rolling nightly release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # A single fixed tag keeps the download URL stable and avoids a tag per commit.
          gh release view nightly >/dev/null 2>&1 || gh release create nightly \
            --prerelease \
            --title "Rolling development build" \
            --notes "Unsigned build artifact of the latest master commit. Android cannot install it as-is: sign it with your own key. See docs/self-hosted-updates.md."
          gh release upload nightly glance-unsigned.apk build.json --clobber
